version: 2

models:

  - name: dim_cliente
    description: >
      Dimensão de clientes. Possui uma linha para cada cliente
      identificado na base de vendas.

    columns:
      - name: id_cliente
        description: Identificador único do cliente.
        data_tests:
          - not_null
          - unique


  - name: dim_produto
    description: >
      Dimensão de produtos. Possui uma linha para cada produto
      identificado na base de vendas.

    columns:
      - name: id_produto
        description: Identificador único do produto.
        data_tests:
          - not_null
          - unique


  - name: dim_categoria
    description: >
      Dimensão contendo as categorias de produtos existentes
      na base de vendas.

    columns:
      - name: categoria_produto
        description: Categoria associada ao produto no evento de venda.
        data_tests:
          - not_null
          - unique


  - name: dim_localidade
    description: >
      Dimensão de localidades utilizadas nas vendas.
      O grão corresponde à combinação de UF e cidade.

    columns:
      - name: uf
        description: Unidade federativa da localidade.
        data_tests:
          - not_null

      - name: cidade
        description: Cidade da localidade.
        data_tests:
          - not_null


  - name: dim_data
    description: >
      Dimensão temporal construída a partir da data dos pedidos.
      Possui uma linha para cada data existente na base.

    columns:
      - name: data_pedido
        description: Data do pedido.
        data_tests:
          - not_null
          - unique

      - name: ano
        description: Ano correspondente à data do pedido.
        data_tests:
          - not_null

      - name: mes
        description: Número do mês correspondente à data do pedido.
        data_tests:
          - not_null

      - name: trimestre
        description: Trimestre correspondente à data do pedido.
        data_tests:
          - not_null


  - name: fato_pedidos
    description: >
      Tabela fato contendo os eventos de venda, suas medidas
      e as chaves utilizadas para relacionamento com as dimensões.

    columns:

      - name: id_pedido
        description: Identificador único do pedido.
        data_tests:
          - not_null
          - unique

      - name: id_cliente
        description: Identificador do cliente relacionado ao pedido.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_cliente')
                field: id_cliente

      - name: id_produto
        description: Identificador do produto relacionado ao pedido.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_produto')
                field: id_produto

      - name: categoria_produto
        description: Categoria do produto registrada no pedido.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_categoria')
                field: categoria_produto

      - name: uf
        description: Unidade federativa associada ao pedido.
        data_tests:
          - not_null

      - name: cidade
        description: Cidade associada ao pedido.
        data_tests:
          - not_null

      - name: data_pedido
        description: Data em que o pedido foi realizado.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_data')
                field: data_pedido

      - name: quantidade
        description: Quantidade de unidades vendidas.

      - name: preco_unitario
        description: Preço unitário do produto.

      - name: desconto_pct
        description: Percentual de desconto aplicado ao pedido.

      - name: valor_frete
        description: Valor do frete associado ao pedido.

      - name: valor_bruto
        description: Valor bruto da venda antes dos descontos.

      - name: valor_total
        description: Valor total da venda.

      - name: canal_venda
        description: Canal pelo qual a venda foi realizada.

      - name: forma_pagamento
        description: Forma de pagamento utilizada no pedido.

      - name: status_pedido
        description: Status do pedido.
